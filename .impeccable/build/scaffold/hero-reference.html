<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: challenger-cityscape.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yantramanav:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#1d2b2f}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1376px">
  <div class="r-masthead-brand region chrome" data-region="masthead-brand"><!-- logo icon and brand name text Vidrios, espejos y más --></div>
  <div class="r-nav-links region control" data-region="nav-links"><!-- navigation links for Espejos, Mamparas, Vidrieras, Contacto: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-links); a control need not have button chrome --></div>
  <div class="r-nav-cta region control" data-region="nav-cta"><!-- green WhatsApp button in top navigation bar: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-cta); a control need not have button chrome --></div>
  <div class="r-badges-strip region control" data-region="badges-strip"><!-- location and custom craft pill badges for General Alvear and Fabricación a medida: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop badges-strip); a control need not have button chrome --></div>
  <div class="r-hero-headline region text" data-region="hero-headline"><!-- bold white main title Vidrios, espejos y más --><p style="font-size:var(--r-hero-headline-font);font-family:var(--r-hero-headline-family),sans-serif;font-weight:var(--r-hero-headline-weight);line-height:1.05;margin:0">hero-headline</p></div>
  <div class="r-hero-sub region text" data-region="hero-sub"><!-- subtitle text La claridad del oficio y el brillo del diseño a medida --><p style="line-height:1.05;margin:0">hero-sub</p></div>
  <div class="r-hero-cta region control" data-region="hero-cta"><!-- emerald green WhatsApp consultation primary CTA button: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop hero-cta); a control need not have button chrome --></div>
  <figure class="r-left-glass-prism region plate" data-region="left-glass-prism"><img src="../../../assets/plates/left-glass-prism.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-right-glass-prism region plate" data-region="right-glass-prism"><img src="../../../assets/plates/right-glass-prism.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-card-mirror-plate region plate" data-region="card-mirror-plate"><img src="../../../assets/plates/card-mirror-plate.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-card-mirror-caption region text" data-region="card-mirror-caption"><!-- caption text for bespoke backlit mirrors --><p style="font-size:var(--r-card-mirror-caption-font);line-height:1.05;margin:0">card-mirror-caption</p></div>
  <figure class="r-card-partition-plate region plate" data-region="card-partition-plate"><img src="../../../assets/plates/card-partition-plate.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-card-partition-caption region text" data-region="card-partition-caption"><!-- caption text for architectural glass partitions --><p style="line-height:1.05;margin:0">card-partition-caption</p></div>
  <figure class="r-card-storefront-plate region plate" data-region="card-storefront-plate"><img src="../../../assets/plates/card-storefront-plate.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-card-storefront-caption region text" data-region="card-storefront-caption"><!-- caption text for modern storefront glass installations --><p style="line-height:1.05;margin:0">card-storefront-caption</p></div>
  <figure class="r-lower-card-shower-plate region plate" data-region="lower-card-shower-plate"><img src="../../../assets/plates/lower-card-shower-plate.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-lower-card-doors-plate region plate" data-region="lower-card-doors-plate"><img src="../../../assets/plates/lower-card-doors-plate.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-lower-card-frameless-plate region plate" data-region="lower-card-frameless-plate"><img src="../../../assets/plates/lower-card-frameless-plate.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
</main>
</body>
</html>
